<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NYS Builder Actions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="actions">
    <a class="feedback-btn" href="https://github.com/tmaier-kettering/nys-builder/issues/new" target="_blank" rel="noopener noreferrer">🐛 Feedback / Bug Report</a>
    <div class="page">
      <nav class="page-nav" aria-label="Primary">
        <a class="page-nav-link" href="./index.html">Policies</a>
        <a class="page-nav-link active" href="./actions.html" aria-current="page">Actions</a>
      </nav>
      <h1>NYS Builder Action Explorer</h1>
      <p class="subtitle">Browse, group, filter, and share approved actions.</p>
      <div class="search-row">
        <label class="search-label" for="policySearch">Search action title</label>
        <input
          id="policySearch"
          type="search"
          placeholder="Search within action titles..."
          autocomplete="off"
        />
      </div>

      <div class="content">
        <aside class="sidebar">
          <details class="sidebar-panel" open>
            <summary class="sidebar-summary">Options</summary>

            <details class="control" open>
              <summary class="filter-header">View level</summary>
              <div class="view-level-selector" id="viewLevelSelector">
                <button class="view-level-btn active" data-view="skim">Skim</button>
                <button class="view-level-btn" data-view="peruse">Peruse</button>
                <button class="view-level-btn" data-view="deep-dive">Deep Dive</button>
              </div>
            </details>

            <details class="control" open>
              <summary class="filter-header">Group cards by</summary>
              <select id="groupBy">
                <option value="scope">Scope</option>
                <option value="issueAreas">Topic</option>
              </select>
            </details>

            <details class="control" open>
              <summary class="filter-header">Filter by scope</summary>
              <select id="filterScope"></select>
            </details>

            <details class="control" open>
              <summary class="filter-header">Filter by topic/subtopic</summary>
              <div id="topicSubtopicFilter" class="topic-filter"></div>
            </details>
          </details>
        </aside>

        <main class="main">
          <div class="main-controls">
            <label>
              <input id="selectAllVisible" type="checkbox" />
              Select all visible cards
            </label>
            <div>
              <button id="shareBtn" type="button">Share selected view</button>
            </div>
          </div>
          <div id="policyGroups"></div>
        </main>
      </div>

      <footer>Built by Dr. Torsten Maier</footer>
    </div>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
