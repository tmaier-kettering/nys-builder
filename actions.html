<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NYS Builder Actions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="actions">
    <a class="feedback-btn" href="https://github.com/tmaier-kettering/nys-builder/issues/new" target="_blank" rel="noopener noreferrer">🐛 Feedback / Bug Report</a>
    <div class="page">
      <header class="page-header">
        <div class="page-brand">
          <a class="company-logo-link" href="https://lcoyusa.com" target="_blank" rel="noopener noreferrer" aria-label="Visit LCOY USA">
            <img class="company-logo" src="./assets/LCOY_USA_Logo.png" alt="LCOY USA logo" />
          </a>
        </div>
        <nav class="page-nav" aria-label="Primary">
          <a class="page-nav-link" href="./index.html">Policies</a>
          <a class="page-nav-link active" href="./actions.html" aria-current="page">Actions</a>
        </nav>
      </header>
      <h1>NYS Builder Action Explorer</h1>
      <p class="subtitle">Browse, group, filter, and share approved actions.</p>
      <div class="search-row">
        <label class="search-label" for="itemSearch">Search action title</label>
        <input
          id="itemSearch"
          type="search"
          placeholder="Search within action titles..."
          autocomplete="off"
        />
      </div>

      <div class="content">
        <aside class="sidebar">
          <details class="sidebar-panel" open>
            <summary class="sidebar-summary">Options</summary>

            <details class="control">
              <summary class="filter-header">
                <span>View level</span>
              </summary>
              <div class="view-level-selector" id="viewLevelSelector">
                <button class="view-level-btn active" data-view="skim" type="button">
                  <span>Skim</span>
                  <span class="tooltip-icon" title="Shows only the headline text for quick scanning." aria-label="Skim view info">?</span>
                </button>
                <button class="view-level-btn" data-view="peruse" type="button">
                  <span>Peruse</span>
                  <span class="tooltip-icon" title="Shows headline and short explanation for each card." aria-label="Peruse view info">?</span>
                </button>
                <button class="view-level-btn" data-view="deep-dive" type="button">
                  <span>Deep Dive</span>
                  <span class="tooltip-icon" title="Shows all available card details." aria-label="Deep Dive view info">?</span>
                </button>
              </div>
            </details>

            <div class="control control-static">
              <div class="filter-header-row">
                <span class="filter-header-label">Group cards by</span>
                <span class="tooltip-icon" title="Organizes cards by Scope or Topic." aria-label="Group cards by info">?</span>
              </div>
              <select id="groupBy">
                <option value="scope">Scope</option>
                <option value="issueAreas">Topic</option>
              </select>
            </div>

            <div class="control control-static">
              <div class="filter-header-row">
                <span class="filter-header-label">Filter by scope</span>
                <span class="tooltip-icon" title="Limits cards to one scope category." aria-label="Filter by scope info">?</span>
              </div>
              <select id="filterScope"></select>
            </div>

            <details class="control">
              <summary class="filter-header">
                <span>Filter by topic/subtopic</span>
              </summary>
              <div id="topicSubtopicFilter" class="topic-filter"></div>
            </details>
          </details>
        </aside>

        <main class="main">
          <div class="main-controls">
            <label>
              <input id="selectAllVisible" type="checkbox" />
              Select all visible cards
            </label>
            <div>
              <button id="shareBtn" type="button">
                <span>Share selected view</span>
                <span class="tooltip-icon" title="Copies a link with your selected cards and current view." aria-label="Share selected view info">?</span>
              </button>
            </div>
          </div>
          <div id="itemGroups"></div>
        </main>
      </div>

      <footer>Built by Dr. Torsten Maier</footer>
    </div>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
