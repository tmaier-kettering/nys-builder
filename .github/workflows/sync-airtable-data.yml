name: Sync Airtable Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-airtable-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Airtable data
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: node scripts/sync-airtable-data.mjs

      - name: Detect changes
        id: changes
        run: |
          # metadata.generatedAt is rewritten on every run, so ignore it:
          # only a real data change should commit and deploy.
          strip() { grep -v '"generatedAt"'; }
          if git cat-file -e HEAD:data.js 2>/dev/null              && diff -q <(git show HEAD:data.js | strip) <(strip < data.js) >/dev/null; then
            git checkout -- data.js
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add data.js
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data.js
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Airtable data"

      - name: Rebase and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Deploy site (only when data changed)
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref "$GITHUB_REF_NAME"
