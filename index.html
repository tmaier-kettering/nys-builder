<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NYS Builder Policies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="feedback-btn" href="https://github.com/tmaier-kettering/nys-builder/issues/new" target="_blank" rel="noopener noreferrer">🐛 Feedback / Bug Report</a>
    <div class="page">
      <h1>NYS Builder Policy Explorer</h1>
      <p class="subtitle">Browse, group, filter, and export policy recommendations.</p>

      <div class="content">
        <aside class="sidebar">
          <h2>Options</h2>

          <details class="control" open>
            <summary class="filter-header">View level</summary>
            <div class="view-level-selector" id="viewLevelSelector">
              <button class="view-level-btn active" data-view="skim">Skim</button>
              <button class="view-level-btn" data-view="peruse">Peruse</button>
              <button class="view-level-btn" data-view="deep-dive">Deep Dive</button>
            </div>
          </details>

          <details class="control" open>
            <summary class="filter-header">Group cards by</summary>
            <select id="groupBy">
              <option value="scope">Scope</option>
              <option value="issueAreas">Topic</option>
            </select>
          </details>

          <details class="control" open>
            <summary class="filter-header">Filter by scope</summary>
            <select id="filterScope"></select>
          </details>

          <details class="control" open>
            <summary class="filter-header">Filter by topic/subtopic</summary>
            <div id="topicSubtopicFilter" class="topic-filter"></div>
          </details>
        </aside>

        <main class="main">
          <div class="main-controls">
            <label>
              <input id="selectAllVisible" type="checkbox" />
              Select all visible cards
            </label>
            <div>
              <button id="shareBtn" type="button">Share selected view</button>
              <button id="pdfBtn" type="button">Download selected PDF</button>
            </div>
          </div>
          <div id="policyGroups"></div>
        </main>
      </div>

      <footer>Built from Airtable</footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="./data.js"></script>
    <script>
      const els = {
        viewLevelSelector: document.getElementById('viewLevelSelector'),
        groupBy: document.getElementById('groupBy'),
        filterScope: document.getElementById('filterScope'),
        topicSubtopicFilter: document.getElementById('topicSubtopicFilter'),
        selectAllVisible: document.getElementById('selectAllVisible'),
        shareBtn: document.getElementById('shareBtn'),
        pdfBtn: document.getElementById('pdfBtn'),
        policyGroups: document.getElementById('policyGroups')
      };

      const state = {
        policies: [],
        policyColumns: [],
        actionsById: new Map(),
        selectedPolicyIds: new Set(),
        visiblePolicyIds: [],
        onlySelectedFromLink: false,
        viewMode: 'skim',
        cardViewLevels: new Map(),
        topicSubtopicFilter: new Set(),
        topicsData: []
      };

      const MISSING_ACTION_LABEL = '(not found)';
      const PDF_FILE_PREFIX = 'selected-policies';
      const PDF_PAGE_MARGIN = 40;
      const PDF_LINE_HEIGHT = 14;
      const PDF_CONTENT_BOTTOM_MARGIN = 75;
      const PDF_TOC_TITLE_SIZE = 22;
      const PDF_FOOTER_TEXT_SIZE = 10;
      const PDF_PAGE_WIDTH = 612;
      const PDF_PAGE_HEIGHT = 792;
      const PDF_FOOTER_LOGO_Y = 18;
      const PDF_FOOTER_PAGE_NUMBER_Y = 24;
      const PDF_LOGO_MAX_WIDTH = 90;
      const PDF_ASSETS = {
        coverPage: './assets/first_page.pdf',
        tableOfContentsBackground: './assets/table_of_contents_background.svg',
        logo: './assets/LCOY_USA_Logo.png'
      };
      const FILE_PROTOCOL_ASSET_HINT =
        ' (Tip: serve the app over HTTP, e.g. `python3 -m http.server 8000`, instead of opening index.html directly.)';
      const sourceData = window.NYS_BUILDER_DATA || {};

      // Columns never shown on cards (identifiers, status, admin fields)
      const HIDDEN_CARD_COLUMNS = ['#', 'Policy ID', 'ID', 'Policy Identifier', 'Approval Status', 'Archived', 'Type'];
      const HIDDEN_CARD_COLUMNS_SET = new Set(HIDDEN_CARD_COLUMNS);

      // Fields shown as chips at the bottom of every card (not as regular fields)
      const CHIP_FIELDS = ['Scope', 'Jurisdiction', 'UNFCCC pillar', 'Topic', 'Subtopic', 'Draft Year'];
      const CHIP_FIELDS_SET = new Set(CHIP_FIELDS);

      // Combined set for card body exclusion
      const CARD_BODY_EXCLUDED = new Set([...HIDDEN_CARD_COLUMNS_SET, ...CHIP_FIELDS_SET]);

      // Regular fields shown per view level in the card body (chip fields shown separately)
      const CARD_COLUMNS_BY_VIEW = {
        skim: ['Policy'],
        peruse: ['Policy', 'Commentary'],
        'deep-dive': 'ALL'
      };

      // Fields shown per view level in the PDF (includes chip fields as plain text)
      const PDF_COLUMNS_BY_VIEW = {
        skim: ['Policy'],
        peruse: ['Policy', 'Scope', 'Jurisdiction', 'UNFCCC pillar', 'Topic', 'Subtopic', 'Commentary', 'Draft Year'],
        'deep-dive': 'ALL'
      };

      function splitMulti(value) {
        return (value || '')
          .split(',')
          .map((v) => v.trim())
          .filter(Boolean);
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function formatFieldValue(value) {
        if (Array.isArray(value)) {
          return value
            .map((item) => String(item ?? '').trim())
            .filter(Boolean)
            .join(', ');
        }
        if (value == null) return '';
        if (typeof value === 'object') {
          try {
            return JSON.stringify(value);
          } catch (error) {
            return String(value);
          }
        }
        return String(value).trim();
      }

      function renderField(label, value) {
        const text = formatFieldValue(value);
        return `<div class="field"><strong>${escapeHtml(label)}:</strong> ${
          text ? escapeHtml(text) : '<span class="muted">N/A</span>'
        }</div>`;
      }

      function normalizePdfText(value) {
        return String(value ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, ' ').trim();
      }

      function formatPdfValue(value) {
        const normalized = normalizePdfText(value);
        return normalized || 'N/A';
      }

      function buildPdfFilename() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const today = `${year}-${month}-${day}`;
        return `${PDF_FILE_PREFIX}-${state.viewMode}-${today}.pdf`;
      }

      function buildFilterOptions(values) {
        return ['All', ...[...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b))];
      }

      function getAssetFetchModeHint() {
        return window.location.protocol === 'file:' ? FILE_PROTOCOL_ASSET_HINT : '';
      }

      async function fetchAssetBytes(path) {
        try {
          const response = await fetch(path);
          if (!response.ok) {
            throw new Error(`Failed to load ${path}: HTTP ${response.status}`);
          }
          return new Uint8Array(await response.arrayBuffer());
        } catch (error) {
          throw new Error(`Failed to load ${path}: ${error.message}${getAssetFetchModeHint()}`);
        }
      }

      async function fetchAssetText(path) {
        try {
          const response = await fetch(path);
          if (!response.ok) {
            throw new Error(`Failed to load ${path}: HTTP ${response.status}`);
          }
          return await response.text();
        } catch (error) {
          throw new Error(`Failed to load ${path}: ${error.message}${getAssetFetchModeHint()}`);
        }
      }

      async function loadSvgAsPngBytes(path, width, height) {
        const svgText = await fetchAssetText(path);
        const blob = new Blob([svgText], { type: 'image/svg+xml' });
        const objectUrl = URL.createObjectURL(blob);

        try {
          const image = await new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error(`Unable to decode SVG asset at ${path}`));
            img.src = objectUrl;
          });

          const canvas = document.createElement('canvas');
          canvas.width = Math.ceil(width);
          canvas.height = Math.ceil(height);
          const context = canvas.getContext('2d');
          if (!context) {
            throw new Error(
              'Failed to create 2D canvas context for rendering the table-of-contents background. This may indicate a browser compatibility issue.'
            );
          }

          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/png');
          const base64 = dataUrl.split(',')[1] || '';
          return Uint8Array.from(atob(base64), (char) => char.charCodeAt(0));
        } finally {
          URL.revokeObjectURL(objectUrl);
        }
      }

      function splitTextForPdf(text, font, fontSize, maxWidth) {
        const value = formatPdfValue(text);
        const result = [];
        const paragraphs = value.split(/\r?\n/);

        paragraphs.forEach((paragraph, paragraphIndex) => {
          const words = paragraph.trim().split(/\s+/).filter(Boolean);

          if (!words.length) {
            result.push('');
          } else {
            let line = words[0];
            for (let i = 1; i < words.length; i += 1) {
              const candidate = `${line} ${words[i]}`;
              if (font.widthOfTextAtSize(candidate, fontSize) <= maxWidth) {
                line = candidate;
              } else {
                result.push(line);
                line = words[i];
              }
            }
            result.push(line);
          }

          if (paragraphIndex < paragraphs.length - 1 && result.length > 0 && result[result.length - 1] !== '') {
            result.push('');
          }
        });

        return result;
      }

      function downloadPdfBlob(bytes, filename) {
        const blob = new Blob([bytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = filename;
        document.body.append(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
      }

      function setSelectOptions(selectEl, options) {
        const current = selectEl.value;
        selectEl.replaceChildren();
        options.forEach((opt) => {
          const option = document.createElement('option');
          option.value = opt;
          option.textContent = opt;
          selectEl.append(option);
        });
        if (options.includes(current)) {
          selectEl.value = current;
        }
      }

      function asArrayValues(value) {
        if (Array.isArray(value)) return value.filter(Boolean).map(String);
        if (!value) return [];
        return [String(value)].filter(Boolean);
      }

      function getFilteredPolicies() {
        let filtered = state.policies.filter((policy) => {
          const scopePass = els.filterScope.value === 'All' || policy.scope === els.filterScope.value;

          let topicPass = true;
          if (state.topicSubtopicFilter.size > 0) {
            const policyTopics = asArrayValues(policy.columns?.['Topic']);
            const policySubtopics = asArrayValues(policy.columns?.['Subtopic']);
            topicPass =
              policyTopics.some((t) => state.topicSubtopicFilter.has(t)) ||
              policySubtopics.some((s) => state.topicSubtopicFilter.has(s));
          }

          return scopePass && topicPass;
        });

        if (state.onlySelectedFromLink) {
          filtered = filtered.filter((policy) => state.selectedPolicyIds.has(policy.id));
        }

        return filtered;
      }

      function buildGroups(policies) {
        const groups = new Map();
        const keyName = els.groupBy.value;

        policies.forEach((policy) => {
          const keys =
            keyName === 'issueAreas'
              ? (policy.issueAreas.length ? policy.issueAreas : ['Unspecified'])
              : [policy[keyName] || 'Unspecified'];

          keys.forEach((key) => {
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(policy);
          });
        });

        return [...groups.entries()].sort(([a], [b]) => a.localeCompare(b));
      }

      function chipClass(fieldName) {
        return 'chip chip-' + fieldName.toLowerCase().replace(/[\s/]+/g, '-').replace(/[^a-z0-9-]/g, '');
      }

      function cardHtml(policy, viewMode) {
        const policyId = escapeHtml(policy.id);
        const checked = state.selectedPolicyIds.has(policy.id) ? 'checked' : '';
        const cardView = viewMode || state.viewMode;

        const configuredColumns = CARD_COLUMNS_BY_VIEW[cardView] || CARD_COLUMNS_BY_VIEW.skim;
        const bodyColumns =
          configuredColumns === 'ALL'
            ? state.policyColumns.filter((col) => !CARD_BODY_EXCLUDED.has(col))
            : configuredColumns.filter((col) => state.policyColumns.includes(col));

        const regularFields = bodyColumns
          .map((col) => [col, policy.columns?.[col]])
          .filter(([, value]) => formatFieldValue(value))
          .map(([col, value]) => renderField(col, value))
          .join('');

        // Chips: always shown at bottom of every card
        const chips = CHIP_FIELDS.flatMap((fieldName) => {
          const value = policy.columns?.[fieldName];
          if (!value) return [];
          const values = Array.isArray(value) ? value : [String(value)];
          return values
            .filter(Boolean)
            .map((v) => `<span class="${chipClass(fieldName)}">${escapeHtml(String(v))}</span>`);
        }).join('');

        // Expand/collapse buttons on the right of the card header
        let expandButtons = '';
        if (cardView === 'skim') {
          expandButtons = `<button class="card-expand-btn" data-policy-id="${policyId}" data-target="peruse" title="Expand to Peruse">▼</button>`;
        } else if (cardView === 'peruse') {
          expandButtons =
            `<button class="card-expand-btn" data-policy-id="${policyId}" data-target="skim" title="Collapse to Skim">▲</button>` +
            `<button class="card-expand-btn" data-policy-id="${policyId}" data-target="deep-dive" title="Expand to Deep Dive">▼</button>`;
        } else if (cardView === 'deep-dive') {
          expandButtons = `<button class="card-expand-btn" data-policy-id="${policyId}" data-target="peruse" title="Collapse to Peruse">▼</button>`;
        }

        return `<article class="card" data-policy-id="${policyId}" data-view="${escapeHtml(cardView)}">
      <div class="card-header">
        <input class="card-checkbox" type="checkbox" data-policy-id="${policyId}" ${checked} />
        <h4 class="card-title">${policyId}</h4>
        <div class="card-expand-controls">${expandButtons}</div>
      </div>
      ${regularFields}${chips ? `<div class="card-chips">${chips}</div>` : ''}
    </article>`;
      }

      function updateSelectAllVisible() {
        const ids = state.visiblePolicyIds;
        if (!ids.length) {
          els.selectAllVisible.checked = false;
          els.selectAllVisible.indeterminate = false;
          return;
        }

        const selectedCount = ids.filter((id) => state.selectedPolicyIds.has(id)).length;
        els.selectAllVisible.checked = selectedCount === ids.length;
        els.selectAllVisible.indeterminate = selectedCount > 0 && selectedCount < ids.length;
      }

      function render() {
        const filtered = getFilteredPolicies();
        const groups = buildGroups(filtered);
        state.visiblePolicyIds = [...new Set(filtered.map((p) => p.id))];

        if (!groups.length) {
          els.policyGroups.innerHTML = '<p class="muted">No cards match the current filters.</p>';
          updateSelectAllVisible();
          return;
        }

        els.policyGroups.innerHTML = groups
          .map(
            ([title, policies]) => `
              <section class="group">
                <h3>${escapeHtml(title)}</h3>
                <div class="cards">
                  ${policies.map((p) => cardHtml(p, state.cardViewLevels.get(p.id) || state.viewMode)).join('')}
                </div>
              </section>
            `
          )
          .join('');

        updateSelectAllVisible();
      }

      function renderTopicFilter() {
        const container = els.topicSubtopicFilter;
        container.innerHTML = '';

        state.topicsData.forEach((topic) => {
          const topicWrapper = document.createElement('div');
          topicWrapper.className = 'topic-item';

          const allSubChecked =
            topic.subtopics.length > 0 &&
            topic.subtopics.every((s) => state.topicSubtopicFilter.has(s));
          const someSubChecked = topic.subtopics.some((s) => state.topicSubtopicFilter.has(s));
          const topicIndeterminate = !allSubChecked && someSubChecked;

          const topicLabel = document.createElement('label');
          topicLabel.className = 'topic-label';

          const topicCheckbox = document.createElement('input');
          topicCheckbox.type = 'checkbox';
          topicCheckbox.className = 'topic-checkbox';
          topicCheckbox.checked = allSubChecked;
          topicCheckbox.indeterminate = topicIndeterminate;

          topicCheckbox.addEventListener('change', () => {
            if (topicCheckbox.checked) {
              topic.subtopics.forEach((s) => state.topicSubtopicFilter.add(s));
            } else {
              topic.subtopics.forEach((s) => state.topicSubtopicFilter.delete(s));
            }
            renderTopicFilter();
            render();
          });

          topicLabel.append(topicCheckbox, document.createTextNode('\u00a0' + topic.name));
          topicWrapper.appendChild(topicLabel);

          if (topic.subtopics.length > 0) {
            const subtopicList = document.createElement('div');
            subtopicList.className = 'subtopic-list';

            topic.subtopics.forEach((subtopicName) => {
              const subLabel = document.createElement('label');
              subLabel.className = 'subtopic-label';

              const subCheckbox = document.createElement('input');
              subCheckbox.type = 'checkbox';
              subCheckbox.className = 'subtopic-checkbox';
              subCheckbox.checked = state.topicSubtopicFilter.has(subtopicName);

              subCheckbox.addEventListener('change', () => {
                if (subCheckbox.checked) {
                  state.topicSubtopicFilter.add(subtopicName);
                } else {
                  state.topicSubtopicFilter.delete(subtopicName);
                }
                renderTopicFilter();
                render();
              });

              subLabel.append(subCheckbox, document.createTextNode('\u00a0' + subtopicName));
              subtopicList.appendChild(subLabel);
            });

            topicWrapper.appendChild(subtopicList);
          }

          container.appendChild(topicWrapper);
        });
      }

      function copyShareLink() {
        if (!state.selectedPolicyIds.size) {
          alert('Select at least one card first.');
          return;
        }

        const url = new URL(window.location.href);
        url.searchParams.set('view', state.viewMode);
        url.searchParams.set('selected', [...state.selectedPolicyIds].join(','));
        url.searchParams.set('onlySelected', '1');

        const link = url.toString();

        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(link).then(
            () => alert('Share link copied to clipboard.'),
            () => prompt('Clipboard unavailable - copy this share link manually:', link)
          );
        } else {
          prompt('Clipboard unavailable - copy this share link manually:', link);
        }
      }

      async function downloadPdf() {
        const selectedPolicies = state.policies.filter((policy) => state.selectedPolicyIds.has(policy.id));
        if (!selectedPolicies.length) {
          alert('Select at least one card first.');
          return;
        }

        const grouped = buildGroups(selectedPolicies);
        const pdfLib = window.PDFLib;
        if (!pdfLib?.PDFDocument || !pdfLib?.StandardFonts || !pdfLib?.rgb) {
          alert('PDF download is temporarily unavailable. Please refresh and try again.');
          return;
        }

        try {
          const { PDFDocument, StandardFonts, rgb } = pdfLib;
          const pdfDoc = await PDFDocument.create();
          const pageWidth = PDF_PAGE_WIDTH;
          const pageHeight = PDF_PAGE_HEIGHT;
          const textWidth = pageWidth - PDF_PAGE_MARGIN * 2;
          const helvetica = await pdfDoc.embedFont(StandardFonts.Helvetica);
          const helveticaBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
          let logoImage = null;
          let logoWidth = 0;
          let logoHeight = 0;

          try {
            const coverPdfBytes = await fetchAssetBytes(PDF_ASSETS.coverPage);
            const coverSource = await PDFDocument.load(coverPdfBytes);
            const [coverPage] = await pdfDoc.copyPages(coverSource, [0]);
            pdfDoc.addPage(coverPage);
          } catch (error) {
            console.warn('Cover page asset failed to load. Using fallback cover page.', error);
            const fallbackCover = pdfDoc.addPage([pageWidth, pageHeight]);
            fallbackCover.drawText('NYS Builder Policy Explorer', {
              x: PDF_PAGE_MARGIN,
              y: pageHeight - PDF_PAGE_MARGIN - 40,
              size: 26,
              font: helveticaBold,
              color: rgb(0.08, 0.2, 0.4)
            });
            fallbackCover.drawText('Cover asset could not be loaded in this environment.', {
              x: PDF_PAGE_MARGIN,
              y: pageHeight - PDF_PAGE_MARGIN - 70,
              size: 12,
              font: helvetica,
              color: rgb(0.2, 0.2, 0.2)
            });
          }

          try {
            const logoBytes = await fetchAssetBytes(PDF_ASSETS.logo);
            logoImage = await pdfDoc.embedPng(logoBytes);
            const logoScale = Math.min(1, PDF_LOGO_MAX_WIDTH / logoImage.width);
            logoWidth = logoImage.width * logoScale;
            logoHeight = logoImage.height * logoScale;
          } catch (error) {
            console.warn('Logo asset failed to load. Continuing without footer logo.', error);
            logoImage = null;
          }

          let tocBackground = null;
          try {
            const tocBackgroundBytes = await loadSvgAsPngBytes(
              PDF_ASSETS.tableOfContentsBackground,
              pageWidth,
              pageHeight
            );
            tocBackground = await pdfDoc.embedPng(tocBackgroundBytes);
          } catch (error) {
            console.warn('TOC background asset failed to load. Continuing without TOC background.', error);
            tocBackground = null;
          }

          const tocPage = pdfDoc.addPage([pageWidth, pageHeight]);
          if (tocBackground) {
            tocPage.drawImage(tocBackground, { x: 0, y: 0, width: pageWidth, height: pageHeight });
          }
          tocPage.drawText('Table of Contents', {
            x: PDF_PAGE_MARGIN,
            y: pageHeight - PDF_PAGE_MARGIN - PDF_TOC_TITLE_SIZE,
            size: PDF_TOC_TITLE_SIZE,
            font: helveticaBold,
            color: rgb(0.08, 0.2, 0.4)
          });

          let page = pdfDoc.addPage([pageWidth, pageHeight]);
          let cursorY = pageHeight - PDF_PAGE_MARGIN;
          const groupStartPages = new Map();
          let currentContentPageNumber = 1;

          const ensureSpace = (requiredHeight = PDF_LINE_HEIGHT) => {
            if (cursorY - requiredHeight < PDF_CONTENT_BOTTOM_MARGIN) {
              page = pdfDoc.addPage([pageWidth, pageHeight]);
              currentContentPageNumber += 1;
              cursorY = pageHeight - PDF_PAGE_MARGIN;
            }
          };

          const writeWrapped = (text, options = {}) => {
            const { bold = false, fontSize = 11, indent = 0, spacingAfter = 0 } = options;
            const font = bold ? helveticaBold : helvetica;
            const lines = splitTextForPdf(text, font, fontSize, textWidth - indent);
            const requiredHeight = Math.max(lines.length, 1) * PDF_LINE_HEIGHT + spacingAfter;
            ensureSpace(requiredHeight);
            lines.forEach((line) => {
              page.drawText(line, {
                x: PDF_PAGE_MARGIN + indent,
                y: cursorY,
                size: fontSize,
                font,
                color: rgb(0.1, 0.1, 0.1)
              });
              cursorY -= PDF_LINE_HEIGHT;
            });
            cursorY -= spacingAfter;
          };

          writeWrapped('Selected Policies', { bold: true, fontSize: 16, spacingAfter: 6 });

          // Determine which columns to include based on the current view level
          const pdfViewMode = state.viewMode;
          const pdfConfiguredColumns = PDF_COLUMNS_BY_VIEW[pdfViewMode] || PDF_COLUMNS_BY_VIEW.skim;
          const orderedPdfCols =
            pdfConfiguredColumns === 'ALL'
              ? state.policyColumns.filter((col) => !HIDDEN_CARD_COLUMNS_SET.has(col))
              : state.policyColumns.filter((col) => pdfConfiguredColumns.includes(col));

          grouped.forEach(([title, policies]) => {
            ensureSpace(PDF_LINE_HEIGHT * 3);
            if (!groupStartPages.has(title)) {
              groupStartPages.set(title, currentContentPageNumber);
            }
            writeWrapped(title, { bold: true, fontSize: 13, spacingAfter: 4 });

            policies.forEach((policy) => {
              writeWrapped(formatPdfValue(policy.id), { bold: true, fontSize: 12 });
              orderedPdfCols.forEach((col) => {
                const value = formatFieldValue(policy.columns?.[col]);
                if (value) {
                  writeWrapped(`${col}: ${formatPdfValue(value)}`, { indent: 10 });
                }
              });
              cursorY -= 8;
            });
          });

          let tocCursorY = pageHeight - PDF_PAGE_MARGIN - PDF_TOC_TITLE_SIZE - 28;
          let tocTruncated = false;
          for (const [title] of grouped) {
            const entry = `${title}`;
            const numberLabel = groupStartPages.has(title) ? String(groupStartPages.get(title)) : '-';
            const numberWidth = helvetica.widthOfTextAtSize(numberLabel, 12);
            const maxEntryWidth = pageWidth - PDF_PAGE_MARGIN * 2 - numberWidth - 20;
            const entryLines = splitTextForPdf(entry, helvetica, 12, maxEntryWidth);

            const blockHeight = Math.max(entryLines.length, 1) * PDF_LINE_HEIGHT + 4;
            if (tocCursorY - blockHeight < PDF_CONTENT_BOTTOM_MARGIN) {
              tocTruncated = true;
              break;
            }

            for (let index = 0; index < entryLines.length; index += 1) {
              const line = entryLines[index];
              if (tocCursorY - PDF_LINE_HEIGHT < PDF_CONTENT_BOTTOM_MARGIN) {
                tocTruncated = true;
                break;
              }
              tocPage.drawText(line, {
                x: PDF_PAGE_MARGIN,
                y: tocCursorY,
                size: 12,
                font: helvetica,
                color: rgb(0.08, 0.2, 0.4)
              });

              if (index === 0) {
                tocPage.drawText(numberLabel, {
                  x: pageWidth - PDF_PAGE_MARGIN - numberWidth,
                  y: tocCursorY,
                  size: 12,
                  font: helveticaBold,
                  color: rgb(0.08, 0.2, 0.4)
                });
              }

              tocCursorY -= PDF_LINE_HEIGHT;
            }

            if (tocTruncated) {
              break;
            }
            tocCursorY -= 4;
          }

          if (tocTruncated) {
            tocPage.drawText('Additional sections omitted from this page.', {
              x: PDF_PAGE_MARGIN,
              y: PDF_CONTENT_BOTTOM_MARGIN - 12,
              size: 10,
              font: helvetica,
              color: rgb(0.08, 0.2, 0.4)
            });
          }

          const pages = pdfDoc.getPages();
          pages.forEach((pdfPage, index) => {
            if (index < 2) {
              return;
            }

            const pageNumberLabel = String(index - 1);
            const pageNumberWidth = helvetica.widthOfTextAtSize(pageNumberLabel, PDF_FOOTER_TEXT_SIZE);
            if (logoImage) {
              pdfPage.drawImage(logoImage, {
                x: PDF_PAGE_MARGIN,
                y: PDF_FOOTER_LOGO_Y,
                width: logoWidth,
                height: logoHeight
              });
            }
            pdfPage.drawText(pageNumberLabel, {
              x: pageWidth - PDF_PAGE_MARGIN - pageNumberWidth,
              y: PDF_FOOTER_PAGE_NUMBER_Y,
              size: PDF_FOOTER_TEXT_SIZE,
              font: helvetica,
              color: rgb(0.2, 0.2, 0.2)
            });
          });

          const pdfBytes = await pdfDoc.save();
          downloadPdfBlob(pdfBytes, buildPdfFilename());
        } catch (error) {
          alert(`Unable to generate PDF: ${error.message}`);
        }
      }

      function setViewMode(view) {
        state.viewMode = view;
        els.viewLevelSelector.querySelectorAll('.view-level-btn').forEach((b) => {
          b.classList.toggle('active', b.getAttribute('data-view') === view);
        });
      }

      function bindEvents() {
        // View level text buttons
        els.viewLevelSelector.querySelectorAll('.view-level-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const newView = btn.getAttribute('data-view');
            if (newView === state.viewMode) return;
            setViewMode(newView);
            state.cardViewLevels.clear();
            render();
          });
        });

        // Group by and scope filter
        [els.groupBy, els.filterScope].forEach((el) => el.addEventListener('change', render));

        // Select all visible
        els.selectAllVisible.addEventListener('change', (event) => {
          state.visiblePolicyIds.forEach((id) => {
            if (event.target.checked) {
              state.selectedPolicyIds.add(id);
            } else {
              state.selectedPolicyIds.delete(id);
            }
          });
          render();
        });

        // Card checkbox delegation
        els.policyGroups.addEventListener('change', (event) => {
          const checkbox = event.target.closest('.card-checkbox');
          if (!checkbox) return;
          const id = checkbox.getAttribute('data-policy-id');
          if (checkbox.checked) {
            state.selectedPolicyIds.add(id);
          } else {
            state.selectedPolicyIds.delete(id);
          }
          updateSelectAllVisible();
        });

        // Card expand/collapse delegation
        const VALID_VIEW_MODES = new Set(['skim', 'peruse', 'deep-dive']);
        els.policyGroups.addEventListener('click', (event) => {
          const btn = event.target.closest('.card-expand-btn');
          if (!btn) return;
          const policyId = btn.getAttribute('data-policy-id');
          const target = btn.getAttribute('data-target');
          if (!VALID_VIEW_MODES.has(target)) return;
          state.cardViewLevels.set(policyId, target);
          const policy = state.policies.find((p) => p.id === policyId);
          const cardEl = els.policyGroups.querySelector(`.card[data-policy-id="${CSS.escape(policyId)}"]`);
          if (policy && cardEl) {
            const temp = document.createElement('div');
            temp.innerHTML = cardHtml(policy, target);
            const newCard = temp.firstElementChild;
            if (newCard) cardEl.replaceWith(newCard);
          }
        });

        els.shareBtn.addEventListener('click', copyShareLink);
        els.pdfBtn.addEventListener('click', downloadPdf);
      }

      function initializeFromQuery() {
        const params = new URLSearchParams(window.location.search);

        const view = params.get('view');
        if (['skim', 'peruse', 'deep-dive'].includes(view)) {
          setViewMode(view);
        }

        const selected = splitMulti(params.get('selected'));
        selected.forEach((id) => state.selectedPolicyIds.add(id));

        state.onlySelectedFromLink = params.get('onlySelected') === '1' && selected.length > 0;
      }

      async function load() {
        const actions = Array.isArray(sourceData.actions) ? sourceData.actions : [];
        const policies = Array.isArray(sourceData.policies) ? sourceData.policies : [];

        if (!actions.length && !policies.length) {
          throw new Error('No Airtable data is available in data.js');
        }

        state.actionsById = new Map(
          actions.map((action) => [String(action.id || '').trim(), action.title || 'Untitled Action'])
        );
        const metadataPolicyColumns = Array.isArray(sourceData?.metadata?.policyColumns)
          ? sourceData.metadata.policyColumns.map((name) => String(name || '').trim()).filter(Boolean)
          : [];

        const allPolicies = policies.map((policy) => ({
          id: String(policy.id || '').trim(),
          policyText: policy.policyText || '',
          scope: policy.scope || '',
          type: policy.type || '',
          issueAreas: Array.isArray(policy.issueAreas)
            ? policy.issueAreas.map((item) => String(item).trim()).filter(Boolean)
            : splitMulti(policy.issueAreas),
          commentary: policy.commentary || '',
          actionIds: Array.isArray(policy.actionIds)
            ? policy.actionIds.map((item) => String(item).trim()).filter(Boolean)
            : splitMulti(policy.actionIds),
          columns:
            policy.columns && typeof policy.columns === 'object' && !Array.isArray(policy.columns)
              ? policy.columns
              : {}
        }));

        // Only display policies with Approval Status = "Approved"
        state.policies = allPolicies.filter(
          (policy) => policy.columns?.['Approval Status'] === 'Approved'
        );

        const derivedPolicyColumns = [...new Set(state.policies.flatMap((policy) => Object.keys(policy.columns)))];
        state.policyColumns = [...new Set([...metadataPolicyColumns, ...derivedPolicyColumns])];

        // Load topics/subtopics hierarchy
        if (Array.isArray(sourceData.topics) && sourceData.topics.length > 0) {
          state.topicsData = sourceData.topics
            .map((topic) => ({
              name: String(topic.name || '').trim(),
              subtopics: Array.isArray(topic.subtopics)
                ? topic.subtopics.map((s) => String(s || '').trim()).filter(Boolean)
                : []
            }))
            .filter((t) => t.name)
            .sort((a, b) => a.name.localeCompare(b.name));
        } else {
          // Derive hierarchy from approved policy data as fallback
          const topicSubtopicMap = new Map();
          state.policies.forEach((policy) => {
            const policyTopics = asArrayValues(policy.columns?.['Topic']);
            const policySubtopics = asArrayValues(policy.columns?.['Subtopic']);
            policyTopics.forEach((topic) => {
              if (!topicSubtopicMap.has(topic)) topicSubtopicMap.set(topic, new Set());
              policySubtopics.forEach((sub) => topicSubtopicMap.get(topic).add(sub));
            });
          });
          state.topicsData = [...topicSubtopicMap.entries()]
            .sort(([a], [b]) => a.localeCompare(b))
            .map(([name, subs]) => ({ name, subtopics: [...subs].sort() }));
        }

        setSelectOptions(els.filterScope, buildFilterOptions(state.policies.map((p) => p.scope)));

        renderTopicFilter();
        initializeFromQuery();
        bindEvents();
        render();
      }

      load().catch((err) => {
        const errorEl = document.createElement('p');
        errorEl.className = 'muted';
        errorEl.textContent = `Unable to load Airtable data: ${err.message}`;
        els.policyGroups.replaceChildren(errorEl);
      });
    </script>
  </body>
</html>
